instances:
  - url: nvidia-deepstream.docs.buildwithfern.com/metropolis/deepstream
    custom-domain: docs.nvidia.com/metropolis/deepstream
    multi-source: true


title: DeepStream

global-theme: nvidia

logo:
  href: /metropolis/deepstream/9.1
  right-text: DeepStream

navbar-links:
  - type: github
    value: https://github.com/NVIDIA/DeepStream

experimental:
  mdx-components:
    - ./components

versions:
  - display-name: "9.1"
    path: versions/9.1.yml
    slug: "9.1"

redirects:
  # Generated by utils/generate_redirects.py — re-run from repo root; see scripts README
  - source: "/index.html"
    destination: "/metropolis/deepstream/9.1"
  - source: "/index"
    destination: "/metropolis/deepstream/9.1"
  - source: "/9.1/:path*/index.html"
    destination: "/metropolis/deepstream/9.1/:path*"
  - source: "/:path*/index.html"
    destination: "/metropolis/deepstream/:path*"
  # Sphinx page URLs (foo.html); must follow all :path*/index.html rules above
  - source: "/:path*.html"
    destination: "/metropolis/deepstream/:path*"
  - source: "/9.1/:path*"
    destination: "/metropolis/deepstream/9.1/:path*"
