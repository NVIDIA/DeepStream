TrajectoryManagement:
  reidExtractionInterval: 5
ReID:
  reidType: 2
  batchSize: 64
  workspaceSize: 1000
  reidFeatureSize: 1280
  reidHistorySize: 100
  inferDims: [3, 256, 128]
  networkMode: 0
  inputOrder: 0
  colorFormat: 0
  offsets: [127.5, 127.5, 127.5]
  netScaleFactor: 0.007843
  keepAspc: 0
  useVPICropScaler: 1
  outputReidTensor: 1
  addFeatureNormalization: 1
  minVisibility4GalleryUpdate: 0.6
  onnxFile: /workspace/models/ClipReID/reid_model.onnx
  modelEngineFile: /workspace/models/ClipReID/reid_model.onnx_b64_gpu0_fp32.engine
ReIDService:
  reidServiceType: 1
  enableBlocking: 0
  serviceAddress: 127.0.0.1
  servicePort: 8000
  operateOnClassIds: []
  minVisibility4ReidServiceQuery: 0.6
  topK: 8
  maxGroupCount: 8
  minTopClusterConfidence: 0.58
  minSecondClusterConfidence: 0.56
  maxClusterVariance: 0.0001
  enableIDCorrection: 0
